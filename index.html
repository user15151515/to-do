<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Semestre">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Semestre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#eef0f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1113" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Layout: a desk of ruled sheets; subjects are coloured pills you drag onto a sheet, its margin line takes the colour */
:root{
  --desk:#eef0f2; --paper:#ffffff; --fg:#16181b; --muted:#6b7178; --faint:#b0b5bb;
  --rule:#eaedf0; --line:#e1e4e8; --hover:#f1f3f5; --warn:#c2410c; --nosub:#dde1e5;
  --ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --sheet:0 1px 2px rgba(20,24,30,.06),0 4px 14px rgba(20,24,30,.05);
  --shadow:0 12px 34px rgba(20,24,30,.16);
  --lh:32px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0f1113; --paper:#181b1e; --fg:#e7e9ec; --muted:#959ca5; --faint:#565d65;
  --rule:#22262a; --line:#2a2e33; --hover:#1f2327; --warn:#fb923c; --nosub:#353a40;
  --sheet:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); --shadow:0 12px 34px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0f1113; --paper:#181b1e; --fg:#e7e9ec; --muted:#959ca5; --faint:#565d65;
  --rule:#22262a; --line:#2a2e33; --hover:#1f2327; --warn:#fb923c; --nosub:#353a40;
  --sheet:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); --shadow:0 12px 34px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--desk);color:var(--fg);font:16px/1.45 var(--ui);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:6px}
svg{display:block}
.wrap{max-width:1240px;margin:0 auto;padding-block:22px 140px}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}

/* Top: subject pills + two icons */
.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:28px}
.pills{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px}
.pill{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;font-size:15px;color:var(--muted);cursor:pointer;white-space:nowrap;touch-action:none;user-select:none;-webkit-user-select:none}
.pill:hover{color:var(--fg);background:var(--hover)}
.pill.on{background:var(--paper);color:var(--fg);box-shadow:var(--sheet)}
.pill:focus-visible{outline:2px solid var(--fg)}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.pill.editing{background:var(--paper);color:var(--fg);box-shadow:0 0 0 1.5px var(--c);cursor:text;user-select:text;-webkit-user-select:text}
.pill.editing .dot{cursor:pointer;width:14px;height:14px}
.pill .name{outline:none;min-width:1ch}
.pill.add{width:34px;padding:0;justify-content:center;color:var(--faint);font-size:20px;font-weight:300}
.pill.add:hover{color:var(--fg)}
.round{all:unset;box-sizing:border-box;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--muted);cursor:pointer;flex:none}
.round:hover{background:var(--hover);color:var(--fg)}
.round.new{background:var(--fg);color:var(--desk)}
.round.new:hover{opacity:.88;background:var(--fg);color:var(--desk)}
.round:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.ghost{position:fixed;left:0;top:0;z-index:80;pointer-events:none;box-shadow:var(--shadow);background:var(--paper);color:var(--fg)}

/* Sheets */
.board{display:flex;gap:22px;align-items:flex-start}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:22px;min-height:160px;padding-bottom:40px}
.board>.empty{flex:0 1 300px}
.paper{position:relative;background:var(--paper);border-radius:4px 4px 6px 6px;box-shadow:var(--sheet);padding:14px 16px 6px 32px;min-width:0;transition:box-shadow .15s,transform .15s}
.paper::before{content:"";position:absolute;left:19px;top:0;bottom:0;width:2px;background:var(--c,var(--nosub));transition:background .25s,width .2s}
.paper.has-sub::before{width:3px}
.paper.drop{box-shadow:0 0 0 2px var(--dc),var(--shadow);transform:translateY(-2px)}
.paper.complete{opacity:.7}
.paper.complete:hover,.paper.complete:focus-within{opacity:1}
.p-grip{position:absolute;top:2px;left:50%;transform:translateX(-50%);color:var(--faint);cursor:grab;padding:3px 12px;opacity:0;transition:opacity .15s;touch-action:none}
.paper:hover .p-grip{opacity:1}
@media (hover:none){.p-grip{opacity:.6}}
.p-head{display:flex;align-items:center;gap:2px;min-height:30px}
.p-head .sp{flex:1}
.when{all:unset;cursor:pointer;font-size:14px;color:var(--muted);padding:2px 6px;margin-left:-6px;border-radius:6px}
.when:hover{background:var(--hover);color:var(--fg)}
.when.soon,.when.late{color:var(--warn)}
.ic{all:unset;box-sizing:border-box;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--faint);cursor:pointer;opacity:0;transition:opacity .15s;position:relative}
.ic:hover{background:var(--hover);color:var(--fg)}
.ic.on{opacity:1;color:var(--fg)}
.ic:focus-visible{opacity:1;outline:2px solid var(--fg)}
.paper:hover .ic,.paper:focus-within .ic{opacity:1}
@media (hover:none){.ic{opacity:.75}}
.dt{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;cursor:pointer}
.dt.show{position:static;opacity:1;width:auto;height:30px;font:14px var(--ui);color:var(--fg);background:var(--hover);border-radius:6px;padding:0 6px}
.ic.reveal{width:auto;opacity:1}
.p-title{font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-.015em;margin:2px 0 10px;outline:none;border-radius:6px;padding:2px 4px;margin-left:-4px;overflow-wrap:anywhere;text-wrap:balance}
.p-title:focus{background:var(--hover)}
.p-title:empty::before{content:attr(data-ph);color:var(--faint);font-weight:500}
.paper.has-sub .p-title:empty::before{color:var(--c);font-weight:600}
.bar{height:4px;border-radius:4px;background:var(--rule);overflow:hidden;margin:0 0 10px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--c,var(--fg));transition:width .4s cubic-bezier(.3,.7,.3,1)}

.lines{background-image:repeating-linear-gradient(to bottom,transparent 0 calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px) var(--lh))}
.items{list-style:none;margin:0;padding:0;min-height:1px}
.it{display:grid;grid-template-columns:22px minmax(0,1fr) auto 26px;column-gap:6px;align-items:start;padding-left:calc(var(--lvl,0) * 24px);line-height:var(--lh);touch-action:pan-y;transition:padding-left .18s ease}
.bullet{color:var(--faint);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;text-align:center;transition:color .15s,transform .15s;border-radius:6px}
.bullet:hover{color:var(--fg);background:var(--hover)}
.it-text{outline:none;min-width:0;overflow-wrap:anywhere;border-radius:4px;padding:0 4px;margin-left:-4px;transition:color .25s}
.it-text:focus{background:var(--hover)}
.it.done .it-text{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
.it.done .bullet{color:var(--line)}
.cb{all:unset;cursor:pointer;width:18px;height:18px;margin-top:7px;border:1.5px solid var(--faint);border-radius:5px;display:grid;place-items:center;justify-self:end;transition:background .15s,border-color .15s}
.cb:hover{border-color:var(--fg)}
.cb:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.cb svg{color:var(--paper)}
.cb svg path{stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset .22s ease-out .05s}
.it.done .cb{background:var(--c,var(--fg));border-color:var(--c,var(--fg))}
.it.done .cb svg path{stroke-dashoffset:0}
.it.pop .cb{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.blank{height:calc(var(--lh) * 2);cursor:text}
.sortable-ghost{opacity:.3}
.paper.sortable-chosen{box-shadow:var(--shadow)}
.empty{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px dashed var(--line);border-radius:6px;min-height:200px;display:grid;place-items:center;color:var(--faint);font-size:36px;font-weight:300}
.empty:hover{color:var(--fg);border-color:var(--faint)}

/* Sheet & toast */
#sheet{position:fixed;inset:0;z-index:60;background:rgba(10,12,15,.35);display:grid;place-items:center;padding:16px}
.sheet-card{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet-card textarea{width:100%;min-height:64px;resize:vertical;font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--fg);background:var(--desk);border:1px solid var(--line);border-radius:8px;padding:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .sp{flex:1}
.btn{all:unset;cursor:pointer;box-sizing:border-box;font-size:15px;font-weight:500;padding:9px 14px;border-radius:9px;background:var(--fg);color:var(--paper)}
.btn.ghostb{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghostb:hover{background:var(--hover)}
.btn.danger{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1px var(--line)}
.switch{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;font-size:15px;padding:4px 0}
.switch b{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .15s;flex:none}
.switch b::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--paper);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch.on b{background:var(--fg)}
.switch.on b::after{transform:translateX(14px)}
.p-sub{font-size:13.5px;font-weight:500;color:var(--c);margin-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
#menu{position:fixed;z-index:90;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:4px;min-width:180px}
.mi{all:unset;display:block;width:100%;box-sizing:border-box;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:15px}
.mi:hover,.mi:focus-visible{background:var(--hover);outline:none}
.mi.danger{color:var(--warn)}
.sync{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr{width:132px;height:132px;flex:none;background:#fff;border-radius:10px;padding:6px}
.qr svg{width:100%;height:100%}
.sync-txt{flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.sync-txt span{color:var(--muted)}
.sync-st{font-size:14px}
.note{margin:0;color:var(--muted);font-size:15px}
.cloud{color:var(--faint);position:relative}
.cloud svg .ok,.cloud svg .x{display:none}
.cloud[data-state="ok"] svg .ok{display:block}
.cloud[data-state="ok"]{color:var(--muted)}
.cloud[data-state="wait"] svg,.cloud[data-state="saving"] svg{animation:breathe 1.1s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
.cloud[data-state="offline"],.cloud[data-state="error"]{color:var(--warn)}
.cloud[data-state="offline"] svg .x,.cloud[data-state="error"] svg .x{display:block}
#syncbar{position:fixed;z-index:65;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px);background:var(--paper);color:var(--warn);box-shadow:0 0 0 1.5px var(--warn),var(--shadow);border-radius:12px;padding:10px 16px;font-size:14.5px}
#syncbar button{all:unset;cursor:pointer;font-weight:600;white-space:nowrap}
.code{font:14px ui-monospace,Menlo,monospace;color:var(--muted);word-break:break-all}
.link-in{all:unset;box-sizing:border-box;flex:1;min-width:0;padding:9px 12px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--line);font-size:15px}
.when.rep{color:var(--muted)}
.days{display:flex;gap:4px;padding:6px 6px 4px}
.day{all:unset;box-sizing:border-box;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:14px;color:var(--muted)}
.day:hover{background:var(--hover);color:var(--fg)}
.day.on{background:var(--fg);color:var(--paper)}
.every{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:15px;color:var(--muted)}
.every.on{color:var(--fg)}
.every span{flex:1;text-align:center}
.every button{all:unset;box-sizing:border-box;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line);color:var(--fg)}
.every button:hover{background:var(--hover)}
.rep-hint{margin:0;padding:4px 10px 8px;font-size:14px;color:var(--muted)}
.meta{display:flex;align-items:center;gap:2px;height:var(--lh)}
.idate,.irep{all:unset;cursor:pointer;font-size:13.5px;color:var(--muted);padding:0 5px;border-radius:6px;line-height:24px;white-space:nowrap}
.idate:hover,.irep:hover{background:var(--hover);color:var(--fg)}
.idate.soon,.idate.late{color:var(--warn)}
.it.done .idate{color:var(--faint)}
.imore{all:unset;cursor:pointer;width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:var(--faint);opacity:0}
.imore:hover{background:var(--hover);color:var(--fg)}
.it:hover .imore,.it:focus-within .imore{opacity:1}
.imore:focus-visible{opacity:1;outline:2px solid var(--fg)}
@media (hover:none){.it:not(:focus-within) .imore{display:none}}
.msep{height:1px;background:var(--line);margin:4px 6px}
.dwrap{padding:6px}
.pop-date{all:unset;box-sizing:border-box;width:100%;padding:8px 10px;border-radius:8px;background:var(--hover);font:15px var(--ui);color:var(--fg)}
.quick{display:flex;gap:6px;padding:2px 6px 6px;flex-wrap:wrap}
.quick button{all:unset;cursor:pointer;font-size:14px;padding:6px 10px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line);color:var(--fg)}
.quick button:hover{background:var(--hover)}
.bullet .tri{display:none;width:100%;height:var(--lh);place-items:center;color:var(--muted)}
.bullet .tri svg{transition:transform .15s}
.it.parent:not(.open) .bullet .tri svg{transform:rotate(-90deg)}
.it.parent:hover .bullet .arr{display:none}
.it.parent:hover .bullet .tri{display:grid}
@media (hover:none){.it.parent .bullet .arr{display:none}.it.parent .bullet .tri{display:grid}}
.icount,.pcount{font-size:13.5px;color:var(--muted);padding:0 5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.paper.folded{padding-bottom:12px}
.paper.folded .p-title{margin-bottom:0}
.paper.folded .bar{margin:8px 0 0}
.donebar{all:unset;cursor:pointer;display:block;font-size:14px;color:var(--muted);padding:6px 0 8px 28px}
.donebar:hover{color:var(--fg)}
html.noscroll,html.noscroll body{overflow:hidden}
#planner{position:fixed;inset:0;z-index:55;background:var(--desk);overflow:auto;overscroll-behavior:contain;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(60px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pl-wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.pl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pl-head h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;gap:10px;min-width:0;overflow-wrap:anywhere}
.pl-head .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.pl-head .sp{flex:1}
.pl-end{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.pl-end input{font:15px var(--ui);color:var(--fg);background:var(--paper);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:9px;padding:7px 10px}
.pl-body{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start}
.tray{position:sticky;top:0;z-index:2;background:var(--paper);border-radius:6px;box-shadow:var(--sheet);padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.tray-h{font-size:15px;font-weight:600;display:flex;justify-content:space-between}
.tray-h span{color:var(--muted);font-weight:400}
.tray ul{min-height:80px;border-radius:6px}
.tray-hint,.tray-empty{margin:0;font-size:14px;color:var(--muted)}
ul.drop{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{font-size:13.5px;color:var(--muted);padding:0 6px 2px}
.cd{background:var(--paper);border-radius:6px;box-shadow:var(--sheet);min-height:120px;padding:7px 6px;display:flex;flex-direction:column;gap:5px;min-width:0}
.cd.we{background:color-mix(in srgb,var(--paper) 70%,var(--desk))}
.cd.off{background:transparent;box-shadow:none}
.cd.today{box-shadow:0 0 0 1.5px var(--fg)}
.cd.dead{box-shadow:0 0 0 1.5px var(--warn)}
.cd-h{display:flex;gap:4px;align-items:baseline;font-size:14px;color:var(--muted);padding:0 3px;flex-wrap:wrap}
.cd-h b{font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.cd-h .wdn{display:none}
.tag{font-size:12.5px;color:var(--fg);margin-left:auto}
.tag.dl{color:var(--warn)}
.cd ul.drop{flex:1;min-height:44px}
.pchip{display:flex;align-items:center;gap:7px;background:var(--paper);box-shadow:inset 3px 0 0 var(--c,var(--fg)),0 0 0 1px var(--line);border-radius:6px;padding:6px 8px 6px 9px;font-size:14.5px;cursor:grab;user-select:none;-webkit-user-select:none;min-width:0}
.pchip:hover{box-shadow:inset 3px 0 0 var(--c,var(--fg)),0 0 0 1px var(--faint)}
.pchip .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .pt i{color:var(--faint)}
.pchip .pc{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pchip.done .pt{color:var(--faint);text-decoration:line-through}
.pchip.late{box-shadow:inset 3px 0 0 var(--warn),0 0 0 1px var(--line)}
.pchip.late .pc:last-child{color:var(--warn)}
.pcb{all:unset;flex:none;cursor:pointer;width:15px;height:15px;border:1.5px solid var(--faint);border-radius:4px;display:grid;place-items:center}
.pcb svg{color:var(--paper);width:9px;height:9px}
.pcb svg path{stroke-dasharray:14;stroke-dashoffset:14}
.pchip.done .pcb{background:var(--c,var(--fg));border-color:var(--c,var(--fg))}
.pchip.done .pcb svg path{stroke-dashoffset:0}
.pchip.sortable-ghost{opacity:.35}
.oth{display:flex;flex-direction:column;gap:2px;padding:0 3px}
.other{font-size:12.5px;color:var(--muted);display:flex;gap:5px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.other i{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.other.done{color:var(--faint);text-decoration:line-through}
.other.dl{color:var(--fg)}
@media (max-width:760px){
  .pl-body{grid-template-columns:minmax(0,1fr);gap:14px}
  .tray{max-height:38vh;overflow:auto}
  .tray ul{min-height:44px}
  .cal{grid-template-columns:minmax(0,1fr)}
  .wd,.cd.off{display:none}
  .cd{min-height:0}
  .cd-h .wdn{display:inline;text-transform:capitalize}
}

function planAuto(){

}

/* ---------- typing ---------- */
document.addEventListener('input', e => {
  const el = e.target.closest?.('[data-edit]'); if (!el) return;
  const v = el.textContent.replace(/\n/g,' ');
  if (el.dataset.edit === 'title') P(el.dataset.id).title = v; else { const r = findItem(el.dataset.id); if (r.it) r.it.t = v; }
  save();
});
const editOrig = new Map();
document.addEventListener('focusin', e => { const el = e.target; if (el.matches?.('[data-edit="item"]') && !editOrig.has(el.dataset.id)) editOrig.set(el.dataset.id, el.textContent.trim()); });
function commitLine(id, v){
  if (!editOrig.has(id)) return;
  const before = editOrig.get(id); editOrig.delete(id);
  if (v && v !== before) offerSubtask(id, before, v);
}
document.addEventListener('focusout', e => {
  const el = e.target;
  if (el.matches?.('[data-edit="item"]')) {
    const v = el.textContent.replace(/\s+/g,' ').trim(), id = el.dataset.id;
    if (!v) {
      const before = editOrig.get(id); editOrig.delete(id);
      const pr = parentOf(id), { p } = findItem(id);
      removeItem(id, false);
      if (before && pr) offerDelete(p, pr, before);
    } else { const r = findItem(id); if (r.it) { r.it.t = v; save(); } commitLine(id, v); }
  } else if (el.matches?.('[data-edit="title"]')) {
    const p = P(el.dataset.id); if (p) { p.title = el.textContent.replace(/\s+/g,' ').trim(); if (!p.title) el.textContent = ''; save(); }
  }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.altKey) {
    const k = e.key.toLowerCase(), t = e.target;
    const nativeField = t.matches?.('input, textarea') && !t.matches('.add');
    if (!nativeField && (k === 'z' || k === 'y')) {
      e.preventDefault();
      if (k === 'y' || e.shiftKey) redo(); else undo();
      return;
    }
  }
}, true);
document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Escape') { if (!menu.hidden) hideMenu(); else if (planId && !el.matches?.('input')) closePlanner(); else if (!$('#sheet').hidden) $('#sheet').hidden = true; else el.blur?.(); return; }
  if (el.matches?.('[data-edit="title"]') && e.key === 'Enter') {
    e.preventDefault(); const p = P(el.dataset.id);
    if (p.items.length) { pendingFocus = { sel:`[data-edit="item"][data-id="${p.items[0].id}"]`, caret:'end' }; applyFocus(); } else addItem(p.id, null, 0);
    return;
  }
  if (!el.matches?.('[data-edit="item"]')) return;
  const id = el.dataset.id, { p, i, it } = findItem(id); if (!it) return;
  if (e.key === 'Tab') { e.preventDefault(); setLevel(id, e.shiftKey ? -1 : 1); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') { e.preventDefault(); it.t = el.textContent.trim() || it.t; dupItem(id); return; }
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const v = el.textContent.trim();
    if (!v) { if (it.lvl > 0) setLevel(id, -1); else el.blur(); return; }
    const sm = v.match(/^(.*?)(\d+)\s*\.\.\.?\s*(\d+)$/);
    if (sm && +sm[3] > +sm[2] && +sm[3] - +sm[2] <= 60) {
      const [, pre, a, b] = sm, list = [];
      for (let n = +a; n <= +b; n++) list.push(n === +a ? Object.assign(it, { t:pre + n }) : It(pre + n, it.lvl));
      p.items.splice(i, 1, ...list); el.textContent = list[0].t; editOrig.delete(id);
      pendingFocus = { sel:`[data-edit="item"][data-id="${list[list.length-1].id}"]`, caret:'end' }; updatePaper(p.id); return;
    }
    it.t = v; commitLine(id, v);
    const e2 = blockEnd(p.items, i);
    if (e2 > i + 1) { if (it.fold) addItem(p.id, e2 - 1, it.lvl); else addItem(p.id, i, Math.min(MAXLVL, it.lvl + 1)); }
    else addItem(p.id, i, it.lvl);
    return;
  }
  if (e.key === 'Backspace' && !el.textContent) {
    e.preventDefault(); const before = editOrig.get(id); editOrig.delete(id); const pr = parentOf(id);
    removeItem(id, true); if (before && pr) offerDelete(p, pr, before);
  }
});
document.addEventListener('paste', e => {
  const el = e.target.closest?.('[data-edit]'); if (!el) return;
  const text = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
  e.preventDefault();
  if (el.dataset.edit === 'item' && /\n/.test(text.trim())) {
    const { p, i, it } = findItem(el.dataset.id);
    const lines = text.split(/\r?\n/).filter(l => l.trim()).map(line => {
      const ind = (line.match(/^[\t ]*/)[0].replace(/\t/g,'  ').length / 2) | 0;
      return It(line.replace(/^\s*([-*•·→>]|\d+[.)]|\[[ x]\])\s*/i,'').trim(), Math.min(MAXLVL, it.lvl + ind));
    });
    if (!it.t.trim()) p.items.splice(i, 1, ...lines); else p.items.splice(i + 1, 0, ...lines);
    pendingFocus = { sel:`[data-edit="item"][data-id="${lines[lines.length-1].id}"]`, caret:'end' }; updatePaper(p.id); return;
  }
  document.execCommand('insertText', false, text.replace(/\s*\n\s*/g,' '));
});

checkResets();
render();
startSync();
setInterval(() => { if (checkResets()) render(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && checkResets()) render(); });
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
